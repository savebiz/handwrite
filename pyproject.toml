[project]
name = "handwrite"
version = "1.0.0"
description = "HandWrite Verify — Evidence-Linked Records Digitization"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pillow>=10.2.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9"
]

[tool.vercel]
entrypoint = "app.backend.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["vendor", ".venv", "node_modules"]

